              "invalid-renderer-pipe-on-value-at-26",
              "invalid-renderer-pipe-on-a-text-node-at-26",
          }

          index = json.load(open("spec-versions.json"))
          schemas = {int(v): json.load(open(path)) for v, path in index["schemas"].items()}
          cases = json.load(open("conformance/index.json"))["cases"]
          errors = []

          for entry in cases:
              case = json.load(open(pathlib.Path("conformance") / entry["path"]))
              spec = case["specVersion"]

              if spec not in schemas:
                  # invalid-spec-version-unsupported is about the ACCEPTED SET,
                  # which spec-versions.json owns. There is no schema to select.
                  continue

              try:
                  jsonschema.validate(case["manifest"], schemas[spec])
                  accepted = True
              except jsonschema.ValidationError:
                  accepted = False

              if case["expect"]["valid"] and not accepted:
                  errors.append(f"{entry['id']}: valid case rejected by the specVersion {spec} schema")

              # An invalid case that the schema accepts is only acceptable when
              # it fails for a reason no schema can see. Naming those exactly is
              # what stops a loosened schema passing this job: without it, a
              # schema of {} would satisfy "valid cases pass" perfectly.
              if accepted and not case["expect"]["valid"] and entry["id"] not in SHAPE_BLIND:
                  errors.append(
                      f"{entry['id']}: invalid case accepted by the specVersion {spec} schema. "
                      "Either the schema lost a rule, or this case belongs in SHAPE_BLIND with a reason.")

          for missing in SHAPE_BLIND - {entry["id"] for entry in cases}:
              errors.append(f"SHAPE_BLIND names {missing}, which is not a conformance case any more")

          for error in errors:
              print(f"::error::{error}")
          print(f"{len(cases)} conformance cases checked against {len(schemas)} schemas")
          sys.exit(1 if errors else 0)
          PY

      - name: The publish script is syntactically sound
        run: bash -n scripts/publish-format-specs.sh

      # A warning, not an error: the bump belongs in the same commit as the
      # change, but a pull request that has not bumped yet is a normal state.
      # publish.yml refuses for real, after merge, before anything is written.
      - name: This version is not already published
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('spec-versions.json'))['version'])")
          URL="https://consultpubcaeast.blob.core.windows.net/package-format/$VERSION/spec-versions.json"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$CODE" = "200" ]; then
            echo "::warning::package-format@$VERSION is already published — bump the version before merging"
          else
            echo "$VERSION is unpublished (HTTP $CODE)"
          fi
