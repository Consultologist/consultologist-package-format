name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Structural only, and deliberately so: what each specVersion MEANS is
      # prose, and the engine repo's test is what proves the accepted set here
      # matches the set it enforces. This checks the artifact is well-formed and
      # complete enough to publish.
      - name: The index is well formed and complete
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          index = json.load(open("spec-versions.json"))
          errors = []

          version = index.get("version", "")
          if not re.fullmatch(r"v\d{4}\.(0[1-9]|1[0-2])\.[1-9]\d*", version):
              errors.append(f"version {version!r} is not vYYYY.MM.N")

          supported = index.get("supported", [])
          if not supported or not all(isinstance(n, int) for n in supported):
              errors.append(f"supported must be a non-empty list of integers, got {supported!r}")
          if supported != sorted(supported):
              errors.append(f"supported must be ascending, got {supported!r}")

          documents = index.get("documents", {})
          # Every accepted version needs a document, and every document needs to
          # be accepted — a spec with no document cannot be conformed to, and a
          # document for a version the engine refuses misleads whoever reads it.
          named = sorted(int(k) for k in documents)
          if named != sorted(supported):
              errors.append(f"documents cover {named} but supported is {sorted(supported)}")

          for spec, filename in sorted(documents.items()):
              path = pathlib.Path(filename)
              if not path.is_file():
                  errors.append(f"document {filename} for spec {spec} does not exist")
              elif f"specVersion {spec}" not in path.read_text():
                  errors.append(f"{filename} never says 'specVersion {spec}' — wrong document for the key?")

          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

      # A normative document whose links rot is a document nobody can follow.
      # Relative links must resolve in this repo; absolute ones must be
      # commit-pinned, never tracking a branch that can move under a published
      # version.
      - name: Links resolve, and outbound links are pinned
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          errors = []
          for doc in sorted(pathlib.Path(".").glob("*.md")):
              for number, line in enumerate(doc.read_text().splitlines(), 1):
                  for target in re.findall(r"\]\(([^)]+)\)", line):
                      if target.startswith("http"):
                          if "/blob/main/" in target or "/tree/main/" in target:
                              errors.append(f"{doc}:{number} links to main, which moves: {target}")
                      elif target.startswith("#"):
                          continue
                      elif not pathlib.Path(target.split("#")[0]).is_file():
                          errors.append(f"{doc}:{number} dangling relative link: {target}")

          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

      # The suite is generated by running the engine's validator, so these
      # check that it is internally coherent — not that the expectations are
      # right, which only the engine can say (it replays them in its own tests).
      - name: The conformance suite is coherent
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          errors = []
          index = json.load(open("conformance/index.json"))
          supported = set(json.load(open("spec-versions.json"))["supported"])

          for entry in index["cases"]:
              path = pathlib.Path("conformance") / entry["path"]
              if not path.is_file():
                  errors.append(f"index names {entry['path']}, which does not exist")
                  continue
              case = json.load(open(path))
              if case["id"] != entry["id"]:
                  errors.append(f"{path}: id {case['id']!r} does not match the index's {entry['id']!r}")
              if case["expect"]["valid"] != entry["valid"]:
                  errors.append(f"{path}: validity disagrees with the index")
              # An invalid case with no error states nothing a reader can act on.
              if not case["expect"]["valid"] and not case["expect"]["errors"]:
                  errors.append(f"{path}: expected invalid but records no error")
              if case["expect"]["valid"] and case["expect"]["errors"]:
                  errors.append(f"{path}: expected valid but records errors")
              # Directory grouping is meaning, not filing: a case under vN must
              # be about specVersion N, and `any` is for the accepted set itself.
              group = path.parent.name
              expected = f"v{case['specVersion']}" if case["specVersion"] in supported else "any"
              if group != expected:
                  errors.append(f"{path}: filed under {group}, expected {expected}")

          for name in ("conformance/catalog-schemas.json",):
              if not pathlib.Path(name).is_file():
                  errors.append(f"{name} is missing; cases cannot be replayed without it")

          for error in errors:
              print(f"::error::{error}")
          print(f"{len(index['cases'])} conformance cases checked")
          sys.exit(1 if errors else 0)
          PY

      # The schemas are generated from the engine's manifest type and checked
      # byte-for-byte there. What CI adds here is the half the engine cannot
      # assert without a schema validator: that the schemas agree with the
      # conformance suite already published beside them.
      - name: Every schema agrees with the conformance suite
        run: |
          pip install --quiet jsonschema
          python3 - <<'PY'
          import json, pathlib, sys, jsonschema

          # Invalid cases a schema cannot be expected to reject, each for a
          # stated reason. Kept explicit so the boundary is a list somebody
          # chose, not whatever the schema happens to miss today.
          SHAPE_BLIND = {
              # Its manifest is byte-identical to a valid case; only the bundle
              # differs, and a schema never sees the bundle.
              "invalid-missing-prompt-file",
              # v9 (#430). A `when` condition is one string to a schema; its
              # grammar — operand types, paths, count(), literals — is the
              # validator's alone. Every condition case is schema-blind.
              "invalid-condition-orders-an-enum",
              "invalid-condition-orders-a-boolean",
              "invalid-condition-orders-an-enum-field",
              "invalid-condition-tests-a-text",
              "invalid-condition-tests-a-text-field",
              "invalid-condition-bare-enum",
              "invalid-condition-bare-number",
              "invalid-condition-bare-object",
              "invalid-condition-bare-number-field",
              "invalid-condition-compares-an-object",
              "invalid-condition-compares-an-array",
              "invalid-condition-path-into-a-date",
              "invalid-condition-path-into-an-array",
              "invalid-condition-path-to-undeclared-field",
              "invalid-condition-counts-an-object",
              "invalid-condition-bare-count",
              "invalid-condition-count-not-whole",
              "invalid-condition-count-negative",
              "invalid-condition-number-literal-not-decimal",
              "invalid-condition-number-literal-exponent",
              "invalid-condition-date-literal-not-iso",
              "invalid-condition-enum-literal-undeclared",
              "invalid-condition-boolean-literal-not-true-false",
              "invalid-condition-reads-undeclared-input",
              "invalid-condition-counts-undeclared-input",
              "invalid-condition-trailing-operator",
              "invalid-condition-blank",
              "invalid-condition-stray-quote",
              # The v8 gates on v9 condition forms: same reason, on the v8 schema.
              "invalid-condition-path-at-v8",
              "invalid-condition-count-at-v8",
              "invalid-condition-ordering-at-v8",
              # A fan's target is a cross-reference (a node's forEach against
              # the inputs list) and its item fields are engine-minted;
              # a schema checks one property at a time.
              "invalid-fan-of-undeclared-input",
              "invalid-fan-of-a-non-array",
              "invalid-fan-item-field",
              # minLength counts code units and pattern admits spaces, so
              # whitespace-only and untrimmed values pass the schema; the
              # validator's trim rules are semantic.
              "invalid-title-empty",
              "invalid-description-empty",
              "invalid-tag-empty",
              "invalid-tag-untrimmed",
              # JSON Schema's uniqueItems is case-sensitive; the engine's tag
              # distinctness ignores case.
              "invalid-tag-repeated-ignoring-case",
              # Duplicate field ids and blank labels are semantic rules over
              # an array of objects the schema types but does not relate.
              "invalid-object-duplicate-field",
              "invalid-object-field-without-label",
          }

          index = json.load(open("spec-versions.json"))
          schemas = {int(v): json.load(open(path)) for v, path in index["schemas"].items()}
          cases = json.load(open("conformance/index.json"))["cases"]
          errors = []

          for entry in cases:
              case = json.load(open(pathlib.Path("conformance") / entry["path"]))
              spec = case["specVersion"]

              if spec not in schemas:
                  # invalid-spec-version-unsupported is about the ACCEPTED SET,
                  # which spec-versions.json owns. There is no schema to select.
                  continue

              try:
                  jsonschema.validate(case["manifest"], schemas[spec])
                  accepted = True
              except jsonschema.ValidationError:
                  accepted = False

              if case["expect"]["valid"] and not accepted:
                  errors.append(f"{entry['id']}: valid case rejected by the specVersion {spec} schema")

              # An invalid case that the schema accepts is only acceptable when
              # it fails for a reason no schema can see. Naming those exactly is
              # what stops a loosened schema passing this job: without it, a
              # schema of {} would satisfy "valid cases pass" perfectly.
              if accepted and not case["expect"]["valid"] and entry["id"] not in SHAPE_BLIND:
                  errors.append(
                      f"{entry['id']}: invalid case accepted by the specVersion {spec} schema. "
                      "Either the schema lost a rule, or this case belongs in SHAPE_BLIND with a reason.")

          for missing in SHAPE_BLIND - {entry["id"] for entry in cases}:
              errors.append(f"SHAPE_BLIND names {missing}, which is not a conformance case any more")

          for error in errors:
              print(f"::error::{error}")
          print(f"{len(cases)} conformance cases checked against {len(schemas)} schemas")
          sys.exit(1 if errors else 0)
          PY

      - name: The publish script is syntactically sound
        run: bash -n scripts/publish-format-specs.sh

      # A warning, not an error: the bump belongs in the same commit as the
      # change, but a pull request that has not bumped yet is a normal state.
      # publish.yml refuses for real, after merge, before anything is written.
      - name: This version is not already published
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('spec-versions.json'))['version'])")
          URL="https://consultologistpublic.blob.core.windows.net/package-format/$VERSION/spec-versions.json"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$CODE" = "200" ]; then
            echo "::warning::package-format@$VERSION is already published — bump the version before merging"
          else
            echo "$VERSION is unpublished (HTTP $CODE)"
          fi
