name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Structural only, and deliberately so: what each specVersion MEANS is
      # prose, and the engine repo's test is what proves the accepted set here
      # matches the set it enforces. This checks the artifact is well-formed and
      # complete enough to publish.
      - name: The index is well formed and complete
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          index = json.load(open("spec-versions.json"))
          errors = []

          version = index.get("version", "")
          if not re.fullmatch(r"v\d{4}\.(0[1-9]|1[0-2])\.[1-9]\d*", version):
              errors.append(f"version {version!r} is not vYYYY.MM.N")

          supported = index.get("supported", [])
          if not supported or not all(isinstance(n, int) for n in supported):
              errors.append(f"supported must be a non-empty list of integers, got {supported!r}")
          if supported != sorted(supported):
              errors.append(f"supported must be ascending, got {supported!r}")

          documents = index.get("documents", {})
          # Every accepted version needs a document, and every document needs to
          # be accepted — a spec with no document cannot be conformed to, and a
          # document for a version the engine refuses misleads whoever reads it.
          named = sorted(int(k) for k in documents)
          if named != sorted(supported):
              errors.append(f"documents cover {named} but supported is {sorted(supported)}")

          for spec, filename in sorted(documents.items()):
              path = pathlib.Path(filename)
              if not path.is_file():
                  errors.append(f"document {filename} for spec {spec} does not exist")
              elif f"specVersion {spec}" not in path.read_text():
                  errors.append(f"{filename} never says 'specVersion {spec}' — wrong document for the key?")

          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

      # A normative document whose links rot is a document nobody can follow.
      # Relative links must resolve in this repo; absolute ones must be
      # commit-pinned, never tracking a branch that can move under a published
      # version.
      - name: Links resolve, and outbound links are pinned
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          errors = []
          for doc in sorted(pathlib.Path(".").glob("*.md")):
              for number, line in enumerate(doc.read_text().splitlines(), 1):
                  for target in re.findall(r"\]\(([^)]+)\)", line):
                      if target.startswith("http"):
                          if "/blob/main/" in target or "/tree/main/" in target:
                              errors.append(f"{doc}:{number} links to main, which moves: {target}")
                      elif target.startswith("#"):
                          continue
                      elif not pathlib.Path(target.split("#")[0]).is_file():
                          errors.append(f"{doc}:{number} dangling relative link: {target}")

          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          PY

      # The suite is generated by running the engine's validator, so these
      # check that it is internally coherent — not that the expectations are
      # right, which only the engine can say (it replays them in its own tests).
      - name: The conformance suite is coherent
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          errors = []
          index = json.load(open("conformance/index.json"))
          supported = set(json.load(open("spec-versions.json"))["supported"])

          for entry in index["cases"]:
              path = pathlib.Path("conformance") / entry["path"]
              if not path.is_file():
                  errors.append(f"index names {entry['path']}, which does not exist")
                  continue
              case = json.load(open(path))
              if case["id"] != entry["id"]:
                  errors.append(f"{path}: id {case['id']!r} does not match the index's {entry['id']!r}")
              if case["expect"]["valid"] != entry["valid"]:
                  errors.append(f"{path}: validity disagrees with the index")
              # An invalid case with no error states nothing a reader can act on.
              if not case["expect"]["valid"] and not case["expect"]["errors"]:
                  errors.append(f"{path}: expected invalid but records no error")
              if case["expect"]["valid"] and case["expect"]["errors"]:
                  errors.append(f"{path}: expected valid but records errors")
              # Directory grouping is meaning, not filing: a case under vN must
              # be about specVersion N, and `any` is for the accepted set itself.
              group = path.parent.name
              expected = f"v{case['specVersion']}" if case["specVersion"] in supported else "any"
              if group != expected:
                  errors.append(f"{path}: filed under {group}, expected {expected}")

          for name in ("conformance/catalog-schemas.json", "conformance/format-catalog.json"):
              if not pathlib.Path(name).is_file():
                  errors.append(f"{name} is missing; cases cannot be replayed without it")

          for error in errors:
              print(f"::error::{error}")
          print(f"{len(index['cases'])} conformance cases checked")
          sys.exit(1 if errors else 0)
          PY

      # The schemas are generated from the engine's manifest type and checked
      # byte-for-byte there. What CI adds here is the half the engine cannot
      # assert without a schema validator: that the schemas agree with the
      # conformance suite already published beside them.
      - name: Every schema agrees with the conformance suite
        run: |
          pip install --quiet jsonschema
          python3 - <<'PY'
          import json, pathlib, sys, jsonschema

          # Invalid cases a schema cannot be expected to reject, each for a
          # stated reason. Kept explicit so the boundary is a list somebody
          # chose, not whatever the schema happens to miss today.
          SHAPE_BLIND = {
              # Its manifest is byte-identical to a valid case; only the bundle
              # differs, and a schema never sees the bundle.
              "invalid-missing-prompt-file",
              # v11 (#566). Macro rules are relations and file facts: the
              # orphan and reference rules are cross-references, file
              # presence and emptiness are the bundle's, a blank label
              # survives minLength, and the placeholder grammar lives
              # inside the macro's file — a schema sees none of them.
              "invalid-macro-orphaned",
              "invalid-macro-reference-undeclared",
              "invalid-macro-listed-twice",
              "invalid-macro-file-missing",
              "invalid-macro-file-empty",
              "invalid-macro-without-label",
              "invalid-macro-token-unknown-input",
              "invalid-macro-token-unknown-run-word",
              "invalid-macro-token-profile-signature",
              "invalid-macro-token-unknown-namespace",
              "invalid-macro-token-without-namespace",
              # v9 (#430). A `when` condition is one string to a schema; its
              # grammar — operand types, paths, count(), literals — is the
              # validator's alone. Every condition case is schema-blind.
              "invalid-condition-orders-an-enum",
              "invalid-condition-orders-a-boolean",
              "invalid-condition-orders-an-enum-field",
              "invalid-condition-tests-a-text",
              "invalid-condition-tests-a-text-field",
              "invalid-condition-bare-enum",
              "invalid-condition-bare-number",
              "invalid-condition-bare-object",
              "invalid-condition-bare-number-field",
              "invalid-condition-compares-an-object",
              "invalid-condition-compares-an-array",
              "invalid-condition-path-into-a-date",
              "invalid-condition-path-into-an-array",
              "invalid-condition-path-to-undeclared-field",
              "invalid-condition-counts-an-object",
              "invalid-condition-bare-count",
              "invalid-condition-count-not-whole",
              "invalid-condition-count-negative",
              "invalid-condition-number-literal-not-decimal",
              "invalid-condition-number-literal-exponent",
              "invalid-condition-date-literal-not-iso",
              "invalid-condition-enum-literal-undeclared",
              "invalid-condition-boolean-literal-not-true-false",
              "invalid-condition-reads-undeclared-input",
              "invalid-condition-counts-undeclared-input",
              "invalid-condition-trailing-operator",
              "invalid-condition-blank",
              "invalid-condition-stray-quote",
              # The v8 gates on v9 condition forms: same reason, on the v8 schema.
              "invalid-condition-path-at-v8",
              "invalid-condition-count-at-v8",
              "invalid-condition-ordering-at-v8",
              # A fan's target is a cross-reference (a node's forEach against
              # the inputs list) and its item fields are engine-minted;
              # a schema checks one property at a time.
              "invalid-fan-of-undeclared-input",
              "invalid-fan-of-a-non-array",
              "invalid-fan-item-field",
              # minLength counts code units and pattern admits spaces, so
              # whitespace-only and untrimmed values pass the schema; the
              # validator's trim rules are semantic.
              "invalid-title-empty",
              "invalid-description-empty",
              "invalid-tag-empty",
              "invalid-tag-untrimmed",
              # JSON Schema's uniqueItems is case-sensitive; the engine's tag
              # distinctness ignores case.
              "invalid-tag-repeated-ignoring-case",
              # Duplicate field ids and blank labels are semantic rules over
              # an array of objects the schema types but does not relate.
              "invalid-object-duplicate-field",
              "invalid-object-field-without-label",
              # v10 (#500). A classifier's rules are relations between nodes
              # — its values against its kind, its bindings against what they
              # name, an aggregator's sources against the nodes' kinds — and
              # absence (no values) against a kind the schema types but does
              # not condition on.
              "invalid-classifier-values-without-kind",
              "invalid-classifier-without-values",
              "invalid-classifier-declares-output",
              "invalid-classifier-declares-foreach",
              "invalid-classifier-binds-a-prompt-node",
              "invalid-aggregator-aggregates-a-classifier",
              # v10. Every expression case is schema-blind, as every v9
              # condition case is: the grammar lives inside one string.
              "invalid-condition-node-not-a-classifier",
              "invalid-condition-bare-node",
              "invalid-condition-node-ordered",
              "invalid-condition-node-value-undeclared",
              "invalid-condition-node-in-arithmetic",
              "invalid-condition-arithmetic-on-enum",
              "invalid-condition-arithmetic-without-comparison",
              "invalid-condition-divides-by-zero",
              "invalid-condition-date-times-number",
              "invalid-condition-date-compared-with-number",
              "invalid-condition-arithmetic-undeclared-input",
              "invalid-condition-arithmetic-literal-exponent",
              "invalid-condition-path-into-a-number",
              "invalid-condition-path-to-undeclared-nested-field",
              "invalid-condition-and-undeclared-input",
              "invalid-condition-and-bare-enum",
              "invalid-condition-trailing-and",
              "invalid-condition-unbalanced-parenthesis",
              # The v9 gates on v10 condition forms: same reason, on the v9 schema.
              "invalid-condition-and-at-v9",
              "invalid-condition-or-at-v9",
              "invalid-condition-not-at-v9",
              "invalid-condition-arithmetic-at-v9",
              "invalid-condition-deep-path-at-v9",
              "invalid-condition-node-at-v9",
              # items is required for an array at every level; the nested
              # field's schema types it but, below the top level, does not
              # require it — the completeness rule is the validator's.
              "invalid-nested-array-field-without-items",
              # v12 (#623). The optional pair is a two-property implication,
              # the placement anchor is a cross-reference into the
              # deliverable's aggregator, and the signature-token rules read
              # the macro FILES (token presence, once-per-deliverable,
              # never-optional) — a schema sees one property of one object.
              "invalid-macro-optional-without-default",
              "invalid-macro-default-without-optional",
              # v2026.10.13 (#1224): the same pair judged over the macro FILE's header at 26 —
              # a standalone macro's and a folder item's — a fact no manifest schema sees at all.
              "invalid-macro-optional-without-default-at-26",
              "invalid-macro-default-without-optional-at-26",
              "invalid-macro-folder-item-optional-without-default-at-26",
              "invalid-macro-folder-item-default-without-optional-at-26",
              "invalid-macro-placement-both-anchors",
              "invalid-macro-placement-anchor-not-aggregated",
              "invalid-signature-token-in-optional-macro",
              "invalid-signature-flag-beside-token",
              # v19 (#845). forItem must name an item of the data collection the
              # anchor section fans — a cross-reference into the bundle's data
              # index a schema cannot follow. (The below-19 gate stays
              # schema-catchable: forItem is absent from the v18 schema.)
              "invalid-macro-for-item-missing",
              "invalid-signature-token-twice",
              # v12 § 13. A check's shape rules are conditional on kind
              # (op/of/in/failWith required THERE, forbidden elsewhere;
              # members forbidden on prompts) and its bindings are
              # cross-references to concept-list nodes; the schema types the
              # members but cannot see the kind conditionals or relations.
              "invalid-check-without-op",
              "invalid-check-without-of",
              "invalid-check-without-in",
              "invalid-check-without-fail-with",
              "invalid-check-of-not-concept-list",
              "invalid-check-declares-prompt-fields",
              "invalid-check-reproducible",
              "invalid-check-members-on-a-prompt",
              "invalid-check-orphaned",
              "invalid-result-check-not-a-check-node",
              # v12 § 14. A when is one string to a schema (the v9 sentence);
              # its grammar, the declared-value check, and the
              # never-on-a-signed-deliverable rule are the validator's.
              "invalid-macro-condition-blank",
              "invalid-macro-condition-value-undeclared",
              "invalid-conditional-signature",
              # v12 § 15. Reproducible-is-implied and the output ban are
              # kind conditionals — the same blindness as the check's.
              "invalid-template-reproducible",
              "invalid-template-classification-output",
              # v13 (#728). expectedContent's fit with the value type is a
              # cross-field rule (transcript only on text/array-of-text, form
              # never on an object); the schema types the enum but cannot relate
              # it to `type`. The unknown-channel and below-13 cases are caught
              # by the enum and additionalProperties, so they are NOT here.
              "invalid-expected-content-transcript-on-number",
              "invalid-expected-content-form-on-object",
              # v14 (#729). A union's "at most one sub-declaring arm" rule is
              # cross-field (the arm set against items/fields/values presence);
              # the schema types the arms but cannot relate them. The
              # below-14 and unknown-arm cases stay schema-catchable.
              "invalid-union-two-structured-arms",
              # v15 (#731). "A raw prompt declares no variables" is cross-field
              # (the raw flag against the variables array); the schema types
              # both but cannot relate them. The below-15 case is schema-catchable
              # (the member is absent and additionalProperties is false).
              "invalid-raw-with-variables",
              # v16 (#730). Like transcript, "image is only for a text slot"
              # is cross-field (the enum against `type`); the schema types the
              # channel but cannot relate it. The below-16 case is caught by the
              # enum (image is absent from the v15 schema's expectedContent).
              "invalid-expected-content-image-on-number",
              # v17 (#673). Same cross-field shape for the ambient-note channel;
              # the below-17 case is caught by the enum (ambient-note is absent
              # from the v16 schema's expectedContent).
              "invalid-expected-content-ambient-note-on-number",
              # v18 (#822). "A classifier may not carry a when" is a cross-field
              # rule (the when property against the node's kind); the schema
              # types when on every node but cannot condition it on kind. The
              # below-18 case is schema-catchable (when is absent from the v17
              # schema's node and additionalProperties is false).
              "invalid-node-when-on-classifier",
              # v21 (#923). A schema reference names a catalog contract; whether
              # that contract exists is a lookup into the published catalog the
              # schema cannot follow, and "one id is not in both schemas and
              # schemaRefs" is a cross-map relation the schema cannot express.
              # The below-21 case stays schema-catchable (schemaRefs is absent
              # from the v20 schema and additionalProperties is false).
              "invalid-schema-ref-unknown-contract",
              "invalid-schema-declared-inline-and-as-reference",
              # v22 (#760): "one id is not in more than one of schemas/schemaRefs/
              # customSchemas" is a cross-map relation the schema cannot express, and
              # the strict structured-output subset is a rule on the custom body FILE
              # (additionalProperties:false, every property required, bounded depth)
              # which the manifest schema never sees. The below-22 case stays
              # schema-catchable (customSchemas is absent from the v21 schema and
              # additionalProperties is false).
              "invalid-custom-schema-declared-in-two-maps",
              "invalid-custom-schema-outside-the-subset",
              # v20 (#863) / v23 (#955), named late: "a slot macro has no
              # before/after/forItem anchor" and "a slot macro carries no
              # signature token" are a cross-field relation and a file fact; a
              # node macro id that no library macro declares is a cross-reference.
              "invalid-slot-with-placement",
              "invalid-slot-with-signature",
              "invalid-node-macro-undeclared",
              # v24 (#957): the per-item layer is relations and file facts — a
              # forItem or an item:id literal checked against the fanned
              # collection's index, "the node fans" as a cross-field relation,
              # an item: operand inside a when string, an {{item:…}} token inside
              # the macro FILE. The below-24 forItem case stays schema-catchable
              # (forItem is absent from the v23 node-macro object and
              # additionalProperties is false); the other two below-24 cases are
              # a when string and a file, which a schema never sees.
              "invalid-node-macro-item-when-at-v23",
              "invalid-node-macro-item-token-at-v23",
              "invalid-node-macro-for-item-missing",
              "invalid-node-macro-for-item-on-scalar-node",
              "invalid-node-macro-item-when-on-scalar-node",
              "invalid-node-macro-item-when-not-id",
              "invalid-node-macro-item-when-value-undeclared",
              "invalid-node-macro-item-token-on-scalar-node",
              "invalid-node-macro-item-token-unknown-field",
              "invalid-macro-item-token-on-result",
              # v25 (#1018): the object-template format. A format's rules live in
              # its FILE and in the catalogue; the manifest's schema sees { id, file }.
              # The below-25 item-when gate sits in a data collection's index file.
              "invalid-data-item-when-at-v24",
              "invalid-format-declared-twice",
              "invalid-format-is-a-catalogue-id",
              "invalid-format-file-missing",
              "invalid-format-file-not-json",
              "invalid-format-unknown-type",
              "invalid-format-unknown-producer",
              "invalid-format-not-custom",
              "invalid-format-custom-not-object",
              "invalid-format-object-without-schema",
              "invalid-format-description-blank",
              "invalid-format-custom-with-parameters",
              "invalid-format-values-without-enum",
              "invalid-format-output-macros-on-object",
              # A node's format-dependent rules are relations to the format it names
              # (prompt, onInvalid, failIfEmpty, reproducible, with parameters), to
              # the catalogue, or to other nodes (duplicates, aggregate sources,
              # fans); the fan's edges are derived from the templates' reads.
              "invalid-node-without-format",
              "invalid-node-format-unknown",
              "invalid-duplicate-node-id",
              "invalid-aggregator-declares-format",
              "invalid-aggregator-declares-prompt",
              "invalid-aggregate-source-unknown",
              "invalid-aggregator-aggregates-itself",
              "invalid-computed-node-declares-prompt",
              "invalid-node-without-prompt",
              "invalid-node-prompt-unknown",
              "invalid-on-invalid-on-a-text-format",
              "invalid-on-invalid-missing",
              "invalid-fail-if-empty-on-a-computed-format",
              "invalid-reproducible-on-a-computed-format",
              "invalid-reproducible-on-a-rendered-format",
              "invalid-foreach-unknown-folder",
              "invalid-foreach-fans-a-file",
              "invalid-foreach-fans-a-non-array-input",
              "invalid-foreach-fans-undeclared-input",
              "invalid-non-fan-reads-a-fan",
              # #1065: an aggregator's composed text is readable; what may read it
              # and how are relations over templates and sites, not shapes.
              "invalid-aggregator-read-as-a-value",
              "invalid-aggregator-read-through-a-renderer-pipe",
              "invalid-aggregator-declares-for-each",
              "invalid-condition-reads-an-aggregator",
              "invalid-fans-misaligned",
              "invalid-with-on-a-format-without-parameters",
              "invalid-with-missing-parameter",
              "invalid-with-names-no-parameter",
              "invalid-with-node-of-another-format",
              "invalid-with-node-not-bare",
              "invalid-with-node-not-a-reference",
              "invalid-with-node-unknown",
              "invalid-with-text-from-a-non-text-input",
              "invalid-with-values-not-snake-case",
              "invalid-with-values-from-a-non-enum-input",
              # Macro rules are relations (declared, placed once, placed on a format
              # that takes output macros, on a node that fans the item) and file
              # facts; an item read is inside a template FILE, judged at the node.
              "invalid-macro-file-missing-at-25",
              "invalid-duplicate-macro-id",
              "invalid-macro-never-placed-or-read",
              # #1067: a use is reachability — a read from a template the run
              # renders, a relation over templates no shape expresses.
              "invalid-macro-read-only-by-its-own-instruction",
              "invalid-macro-read-only-by-an-unplaced-macros-text",
              "invalid-node-instance-undeclared",
              "invalid-node-instance-placed-twice",
              "invalid-node-instance-on-a-format-without-output-macros",
              "invalid-inline-macro-on-a-format-without-output-macros",
              "invalid-aggregator-places-a-macro",
              "invalid-node-instance-for-item-without-a-folder-fan",
              "invalid-node-instance-for-item-unknown",
              "invalid-node-instance-reads-item-without-a-fan",
              "invalid-prompt-reaches-item-through-a-snippet",
              "invalid-inline-fill-reads-item-without-a-fan",
              "invalid-deliverable-instance-reads-item",
              "invalid-prompt-reads-item-without-a-fan",
              "invalid-fan-item-member-unknown",
              # Deliverable rules are cross-references (the node, the check, the
              # macro), duplicates, and reachability over the derived edges.
              "invalid-duplicate-deliverable-id",
              "invalid-deliverable-node-unknown",
              "invalid-deliverable-node-not-an-aggregator",
              "invalid-deliverables-share-an-aggregator",
              "invalid-deliverable-check-not-computed",
              "invalid-deliverable-check-unknown",
              "invalid-check-not-named",
              "invalid-deliverable-instance-placed-twice",
              "invalid-deliverable-instance-undeclared",
              "invalid-deliverable-instance-reads-a-fanned-node",
              "invalid-deliverable-signature-flag-and-macro",
              "invalid-deliverable-two-signature-macros",
              "invalid-deliverable-without-a-fan",
              "invalid-node-does-not-feed-the-deliverable",
              # Every template rule — the reference graph, the walker's typing, the
              # strict render probe — reads a template FILE, which a schema never sees.
              "invalid-snippet-cycle",
              "invalid-instruction-cycle",
              "invalid-macro-text-reaches-an-inline-read",
              "invalid-template-assigns-a-reserved-object",
              "invalid-template-captures-a-reserved-object",
              "invalid-template-loop-variable-is-reserved",
              "invalid-template-iterates-a-non-array",
              "invalid-template-indexes-a-non-array",
              "invalid-template-dynamic-access",
              "invalid-template-reads-data",
              "invalid-template-reads-bindings",
              "invalid-template-placeholder-grammar",
              "invalid-template-reads-undeclared-node",
              "invalid-template-reads-undeclared-input",
              "invalid-template-reads-undeclared-snippet",
              "invalid-template-reads-undeclared-macro",
              "invalid-template-reads-a-node-bare",
              "invalid-template-reads-a-snippet-bare",
              "invalid-template-reads-value-of-a-text-format",
              "invalid-template-unknown-node-member",
              "invalid-template-unknown-field",
              "invalid-template-field-of-a-scalar",
              "invalid-template-reads-a-folder-as-a-value",
              "invalid-template-unknown-root",
              "invalid-template-unknown-run-fact",
              "invalid-template-unclosed-code",
              "invalid-node-cycle",
              "invalid-template-fails-strict-rendering",
              # #1058: a renderer pipe's operand is typed by the walker — the pipe is
              # one string inside a template to a schema.
              "invalid-template-renderer-pipe-on-another-format",
              "invalid-template-renderer-pipe-on-a-value",
              "invalid-template-renderer-pipe-on-a-snippets-text",
              "invalid-instruction-fails-strict-rendering",
              # A when is one string to a schema — a Scriban expression typed over
              # the objects; a folder item's when sits in the folder's index file.
              "invalid-condition-legacy-grammar",
              "invalid-condition-blank-at-25",
              "invalid-condition-is-a-template",
              "invalid-condition-enum-value-undeclared-at-25",
              "invalid-condition-orders-an-enum-at-25",
              "invalid-condition-tests-a-text-at-25",
              "invalid-condition-tests-an-enum",
              "invalid-condition-reads-a-text-value",
              "invalid-condition-reads-undeclared-input-at-25",
              "invalid-condition-operator-not-allowed",
              "invalid-condition-yields-a-text",
              "invalid-condition-item-id-undeclared",
              "invalid-folder-item-when-reads-a-node",
              # Snippet facts are the bundle's.
              "invalid-snippet-file-missing",
              "invalid-snippet-folder-without-index",
              "invalid-snippet-folder-item-file-missing",
